
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: monitoring-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-web
  template:
    metadata:
      labels:
        app: nginx-web
    spec:
      containers:
        - name: nginx
          image: ghcr.io/tneftali101/nginx-lab:v1
          ports:
            - containerPort: 80
